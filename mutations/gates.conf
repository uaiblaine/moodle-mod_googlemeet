# Mutation spec of mod_googlemeet: each plugins-directory guard and the test that must redden without it.
# Run from the main session (fleet rule 6), on both database families:
#   mdl mutate moodle-mod_googlemeet moodle-mod_googlemeet/mutations/gates.conf --fast --branch MOODLE_503_STABLE --db pgsql
#   mdl mutate moodle-mod_googlemeet moodle-mod_googlemeet/mutations/gates.conf --fast --branch MOODLE_503_STABLE --db mariadb
#
# tag | file | perl script

# classes/privacy/provider.php: the recordings layout preference (cards or list).
P1_view_preference_undeclared | classes/privacy/provider.php | p1_view_preference_undeclared.pl
#   -> test_metadata_declares_the_recordings_view_preference

P2_view_preference_not_exported | classes/privacy/provider.php | p2_view_preference_not_exported.pl
#   -> test_export_carries_the_users_own_layout
#   -> test_export_without_a_layout_writes_none

P3_view_preference_always_exported | classes/privacy/provider.php | p3_view_preference_always_exported.pl
#   -> test_export_without_a_layout_writes_none

# styles.css: selectors that named only core ids or the plugin's unprefixed classes.
C1_name_text_unscoped | styles.css | c1_name_text_unscoped.pl
#   -> test_styles_are_namespaced

C2_form_calendar_unscoped | styles.css | c2_form_calendar_unscoped.pl
#   -> test_styles_are_namespaced

C3_row_action_focus_unscoped | styles.css | c3_row_action_focus_unscoped.pl
#   -> test_styles_are_namespaced

# lang/en: strings are literals, never concatenations.
L1_lang_concatenation | lang/en/googlemeet.php | l1_lang_concatenation.pl
#   -> test_lang_files_are_data_only

# .gitattributes: what the release package carries.
R1_licence_left_out | .gitattributes | r1_licence_left_out.pl
#   -> test_the_package_carries_a_licence_file

R2_pt_br_shipped | .gitattributes | r2_pt_br_shipped.pl
#   -> test_only_english_strings_ship

R3_es_shipped | .gitattributes | r3_es_shipped.pl
#   -> test_only_english_strings_ship

# settings.php: the activity-module adaptation still rejects a setting stored in the main config table.
S1_setting_in_main_config | settings.php | s1_setting_in_main_config.pl
#   -> test_settings_are_stored_per_plugin
